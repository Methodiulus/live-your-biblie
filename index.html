<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Przeżyj Biblię</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Przeżyj Biblię</h1>

    <nav class="tabs">
      <button id="tab-today" class="active">Dziś</button>
      <button id="tab-library">Biblioteka</button>
    </nav>

    <section id="view" aria-live="polite"></section>

    <p class="note">
      Cytaty i tekst fragmentu to własne tłumaczenie angielskiej Biblii Douay-Rheims
      (domena publiczna), nie przekład liturgiczny. Pozostały tekst to narracja
      i parafraza.
    </p>
  </main>

  <script>
    // ---------- Pomocnicze ----------

    const view = document.getElementById('view');

    // Tworzy element: tag, klasa (lub 0), tekst (lub pominięty).
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function formatDate(isoDate) {
      return new Date(isoDate + 'T12:00:00').toLocaleDateString('pl-PL', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    function setActiveTab(name) {
      document.getElementById('tab-today').classList.toggle('active', name === 'today');
      document.getElementById('tab-library').classList.toggle('active', name === 'library');
    }

    // ---------- Stan ----------

    // Dzisiejsza data w strefie Europe/Warsaw (format RRRR-MM-DD).
    // Do testów: dopisz do adresu ?dzien=2026-10-05
    const override = new URLSearchParams(location.search).get('dzien');
    const today = override || new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Europe/Warsaw'
    }).format(new Date());

    let scenes = {};      // wszystkie sceny z sceny.json
    let origin = 'today'; // skąd otwarto scenę: 'today' albo 'library'
    let path = [];        // etykiety wybranych decyzji w bieżącej rozgrywce

    // ---------- Panele rozwijane ----------

    function contextPanel(scene) {
      if (!scene.context) return null;
      const panel = el('details');
      panel.open = true;
      panel.append(el('summary', null, 'Kontekst fragmentu'));
      scene.context.forEach(text => panel.append(el('p', null, text)));
      return panel;
    }

    function textPanel(scene) {
      const panel = el('details', 'text-panel');
      panel.append(el('summary', null, 'Tekst fragmentu: ' + scene.ref));
      scene.text.forEach(verse => {
        const p = el('p');
        p.append(el('sup', null, verse.v), document.createTextNode(verse.t));
        panel.append(p);
      });
      panel.append(el('p', 'meta',
        'Własne tłumaczenie z angielskiej Biblii Douay-Rheims, nie przekład liturgiczny.'));
      return panel;
    }

    // ---------- Ekran wyboru postaci ----------

    function showRolePicker(date) {
      const scene = scenes[date];
      view.replaceChildren(
        el('p', 'meta', formatDate(date) + ' · ' + scene.ref),
        el('h2', null, scene.title)
      );

      const context = contextPanel(scene);
      if (context) view.append(context);

      view.append(el('p', 'role-line', 'Wybierz postać, którą zagrasz:'));

      const list = el('div', 'card-list');
      scene.roles.forEach(role => {
        const button = el('button', null, role.name);
        button.append(el('small', null, role.blurb));
        button.onclick = () => {
          path = [];
          playNode(date, role.id);
          scrollTo(0, 0);
        };
        list.append(button);
      });

      view.append(list, textPanel(scene));
    }

    // ---------- Przebieg ścieżki ----------

    function playNode(date, roleId, nodeId) {
      const scene = scenes[date];
      const role = scene.roles.find(r => r.id === roleId);
      const node = role.nodes[nodeId || role.start];

      view.replaceChildren(
        el('p', 'meta', formatDate(date) + ' · ' + scene.ref),
        el('h2', null, scene.title),
        el('p', 'role-line', 'Grasz: ' + role.name)
      );

      node.p.forEach(text => view.append(el('p', null, text)));

      if (node.q) {
        const quote = el('blockquote', null, '„' + node.q.t + '”');
        quote.append(el('cite', null, node.q.r));
        view.append(quote);
      }

      const box = el('div', 'choices');

      if (node.choices) {
        node.choices.forEach(choice => {
          const button = el('button', null, choice.label);
          button.onclick = () => {
            path.push(choice.label);
            playNode(date, roleId, choice.to);
            scrollTo(0, 0);
          };
          box.append(button);
        });
      } else {
        showEnding(node, date, roleId, box);
      }

      view.append(box, textPanel(scene));
    }

    // Zakończenie: etykieta ścieżki, wybrane decyzje, rozważanie i przyciski.
    function showEnding(node, date, roleId, box) {
      view.append(el('p', 'ending', node.end || ''));

      if (path.length) {
        view.append(el('h3', null, 'Twoje decyzje'));
        const list = el('ul', 'decisions');
        path.forEach(label => list.append(el('li', null, label)));
        view.append(list);
      }

      if (node.reflection) {
        view.append(el('h3', null, 'Rozważanie'));
        view.append(el('p', 'reflection', node.reflection));
      }

      const again = el('button', null, 'Zagraj tą postacią jeszcze raz');
      again.onclick = () => { path = []; playNode(date, roleId); };

      const other = el('button', null, 'Zagraj inną postacią');
      other.onclick = () => showRolePicker(date);

      box.append(again, other);

      if (origin === 'library') {
        const back = el('button', null, 'Wróć do biblioteki');
        back.onclick = showLibrary;
        box.append(back);
      }
    }

    // ---------- Dziś i biblioteka ----------

    function showToday() {
      origin = 'today';
      setActiveTab('today');

      if (scenes[today]) {
        showRolePicker(today);
      } else {
        view.replaceChildren(
          el('p', null, 'Na dziś nie ma jeszcze sceny. Zajrzyj do biblioteki.')
        );
      }
    }

    function showLibrary() {
      origin = 'library';
      setActiveTab('library');
      view.replaceChildren();

      // Biblioteka to wszystkie sceny z datą wcześniejszą niż dziś.
      const past = Object.keys(scenes).filter(d => d < today).sort().reverse();

      if (!past.length) {
        view.append(el('p', null, 'Biblioteka jest pusta. Pierwsza scena trafi tu jutro.'));
        return;
      }

      const list = el('div', 'card-list');
      past.forEach(date => {
        const button = el('button', null, scenes[date].title);
        button.append(el('small', null, formatDate(date) + ' · ' + scenes[date].ref));
        button.onclick = () => showRolePicker(date);
        list.append(button);
      });
      view.append(list);
    }

    // ---------- Start ----------

    document.getElementById('tab-today').onclick = showToday;
    document.getElementById('tab-library').onclick = showLibrary;

    fetch('sceny.json', { cache: 'no-cache' })
      .then(response => response.json())
      .then(data => {
        scenes = data.scenes || {};
        showToday();
      })
      .catch(() => {
        view.replaceChildren(el('p', null,
          'Nie udało się wczytać scen. Sprawdź, czy plik sceny.json leży obok index.html.'));
      });
  </script>
</body>
</html>
